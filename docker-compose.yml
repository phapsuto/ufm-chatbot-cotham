version: "3.8"

services:
  # ── Chatbot Backend ──────────────────────────────
  chatbot:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      tts:
        condition: service_healthy
    restart: unless-stopped

  # ── VieNeu-TTS Sidecar ──────────────────────────
  tts:
    build: ./tts-service
    ports:
      - "23333:23333"
    volumes:
      - tts-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:23333/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
    restart: unless-stopped

volumes:
  tts-model-cache:
